name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml/requirements-dev.txt
            backend/requirements-dev.txt
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.7,<1'
      - name: Lint Python workspaces
        run: python -m ruff check ml backend

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml/requirements-dev.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        run: >-
          python -m pip install
          -r ml/requirements-dev.txt
          -r backend/requirements-dev.txt
      - name: Test ML workspace
        working-directory: ml
        run: python -m pytest -c pytest.ini
      - name: Test backend workspace
        working-directory: backend
        run: python -m pytest -c pytest.ini
