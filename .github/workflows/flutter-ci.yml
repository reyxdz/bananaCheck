name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: flutter-analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Single source of truth: pin to the fvm version in app/.fvmrc so CI
          # always matches local `fvm flutter` and analyze can't drift.
          flutter-version-file: app/.fvmrc
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos

  flutter-test:
    name: flutter-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Single source of truth: pin to the fvm version in app/.fvmrc.
          flutter-version-file: app/.fvmrc
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --coverage
